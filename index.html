
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drama World</title>
<style>
body{margin:0;font-family:Arial;background:#10131c;color:white}
header{background:#e91e63;padding:22px;text-align:center;font-size:27px;font-weight:bold}
input{box-sizing:border-box;width:90%;margin:18px 5%;padding:14px;border-radius:10px;border:0;font-size:16px}
h2{padding:0 16px}
.card{background:#202637;margin:15px;padding:18px;border-radius:12px}
.card a{color:#ff80ab}
footer{text-align:center;padding:25px;color:#bbb}
</style>
</head>
<body>
<header>🎬 Drama World</header>
<input id="search" placeholder="Search dramas..." oninput="findDrama()">
<h2>Popular Dramas</h2>
<div id="list">
<div class="card"><h3>Pakistani Dramas</h3><p>Discover Pakistani drama episodes.</p><a href="https://www.youtube.com/" target="_blank">Watch on YouTube</a></div>
<div class="card"><h3>Turkish Dramas</h3><p>Explore Turkish drama episodes.</p><a href="https://www.youtube.com/" target="_blank">Watch on YouTube</a></div>
<div class="card"><h3>Indian Dramas</h3><p>Discover Indian drama episodes.</p><a href="https://www.youtube.com/" target="_blank">Watch on YouTube</a></div>
</div>
<footer>Drama World © 2026</footer>
<script>
function findDrama(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.card').forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
